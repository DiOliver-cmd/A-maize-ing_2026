[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator from the 42 A-Maze-ing project."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "dilferre" },
    { name = "vimauric" },
]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
exclude = ["^venv/", "^iv/", "^build/", "^dist/"]
